name: Smart approval macOS baseline validation
on:
  push:
    branches: [validation/smart-approval-shell-comments]
permissions:
  contents: read
jobs:
  approval-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HERMES_TEST_FILE_RETRIES: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: e089be80a1c639d6919d9468077dd4431515d164
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Isolated test environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/hermes-venv" >> "$GITHUB_ENV"
          echo "HERMES_PYTHON=$RUNNER_TEMP/hermes-venv/bin/python" >> "$GITHUB_ENV"
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Original approval tests on unchanged upstream base
        run: >-
          bash scripts/run_tests.sh -j 3
          tests/tools/test_approval.py -q
