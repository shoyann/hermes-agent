name: Smart approval input preservation validation
on:
  push:
    branches: [validation/smart-approval-shell-comments]
permissions:
  contents: read
jobs:
  approval-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HERMES_TEST_FILE_RETRIES: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fd4f125e7023e9c21ce7e66a3605a88fb4ab5e8c
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Isolated test environment
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/hermes-venv" >> "$GITHUB_ENV"
          echo "HERMES_PYTHON=$RUNNER_TEMP/hermes-venv/bin/python" >> "$GITHUB_ENV"
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Approval regression tests on submitted commit
        run: >-
          bash scripts/run_tests.sh -j 3
          tests/tools/test_smart_approval_comments.py
          tests/tools/test_smart_approval_multiline.py
          tests/tools/test_approval_plugin_hooks.py
          tests/tools/test_approval_hook_session_id.py
          tests/tools/test_smart_approval_injection.py
          tests/tools/test_smart_approval_policy.py
          tests/tools/test_approval.py
          tests/tools/test_hardline_blocklist.py
          tests/tools/test_approval_config_readonly.py -q
